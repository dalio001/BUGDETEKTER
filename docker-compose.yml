# Convenience deployment: Postgres + the app (backend serving the built dashboard/SDK).
# First run:  docker compose up --build
# Then once:  docker compose exec app npm run migrate && docker compose exec app npm run seed
#
# NOTE: mirrors the verified local setup, but this compose file itself was authored in an
# environment without a Docker daemon — report issues if something needs a tweak.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bugdetekter
      POSTGRES_PASSWORD: bugdetekter
      POSTGRES_DB: bugdetekter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugdetekter"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bugdetekter:bugdetekter@db:5432/bugdetekter
      PORT: "4000"
      # REQUIRED: generate real values (openssl rand -hex 32). The app runs with
      # NODE_ENV=production and refuses to start while these are placeholders.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. openssl rand -hex 32}
      SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET, e.g. openssl rand -hex 32}
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the seeded admin account}
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"

volumes:
  pgdata:
  uploads:
